<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Color Ball Pop</title>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <div class="celebration" id="celebration" aria-hidden="true"></div>

      <header class="topbar">
        <div>
          <p class="eyebrow">Color Ball Pop</p>
          <h1 id="prompt">Tap a ball</h1>
          <button class="player-badge" id="playerBadge" type="button" aria-label="Current player">
            <span id="playerDot" aria-hidden="true"></span>
            <span id="playerBadgeName">Player 1</span>
            <strong id="playerBadgeScore">0 ★</strong>
          </button>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="repeatButton" type="button" aria-label="Repeat prompt">
            <span aria-hidden="true">🔊</span>
          </button>
          <button class="icon-button parent-button" id="parentButton" type="button" aria-label="Parent settings">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </header>

      <section class="target-strip" id="targetStrip" aria-label="Target color">
        <div class="helper-ball" aria-hidden="true">
          <span></span>
        </div>
        <div class="target-ball" id="targetBall" aria-hidden="true"></div>
        <p id="targetText">Find the matching ball</p>
      </section>

      <section class="cup-strip hidden" id="cupStrip" aria-label="Tournament scores">
        <div>
          <strong id="cupTurn">Player 1's turn</strong>
          <span id="cupRound">Round 1 of 5</span>
        </div>
        <div class="cup-scores" id="cupScores"></div>
      </section>

      <section class="play-area" id="playArea">
        <div class="basket-row hidden" id="basketRow" aria-label="Color baskets"></div>
        <div class="ball-stage" id="ballStage" aria-label="Ball play area"></div>
      </section>

      <section class="feedback" aria-label="Game feedback">
        <div class="sticker" id="sticker" aria-hidden="true">🙂</div>
        <p id="feedbackText">Listen, then pop.</p>
      </section>
    </main>

    <section class="settings-panel hidden" id="settingsPanel" aria-label="Parent settings">
      <div class="settings-card">
        <div class="settings-head">
          <h2>Parent Settings</h2>
          <button class="close-button" id="closeSettings" type="button" aria-label="Close settings">×</button>
        </div>
        <label>
          Balls on screen
          <input id="choiceCount" type="range" min="2" max="5" value="3" />
          <span id="choiceCountLabel">3</span>
        </label>
        <label>
          Learning mode
          <select id="modeSelect">
            <option value="find">Find a color</option>
            <option value="free">Free pop play</option>
            <option value="sort">Sort into baskets</option>
            <option value="count">Count to five</option>
            <option value="memory">Two-color memory</option>
          </select>
        </label>
        <label>
          Voice prompts
          <input id="voiceToggle" type="checkbox" checked />
        </label>
        <label>
          Motion
          <input id="motionToggle" type="checkbox" checked />
        </label>
        <section class="tournament-panel" aria-label="Tournament">
          <h3>Color Cup</h3>
          <div class="tournament-actions">
            <label>
              Turns each
              <select id="tournamentTurns">
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="10">10</option>
              </select>
            </label>
            <button class="start-button" id="startTournament" type="button">Start tournament</button>
            <button class="reset-button hidden" id="endTournament" type="button">End tournament</button>
          </div>
          <p class="hint">Tournament uses Find Color only. Correct is +1. Wrong is -0.5.</p>
        </section>
        <section class="players-panel" aria-label="Players and scores">
          <h3>Players</h3>
          <div class="player-tabs" id="playerTabs"></div>
          <div class="name-fields" id="nameFields"></div>
          <h3>Today</h3>
          <div class="scoreboard" id="scoreboard"></div>
          <button class="reset-button" id="resetToday" type="button">Reset today</button>
        </section>
      </div>
    </section>

    <section class="podium-panel hidden" id="podiumPanel" aria-label="Tournament results">
      <div class="podium-card">
        <h2>Color Cup</h2>
        <div class="podium" id="podium"></div>
        <button class="start-button" id="closePodium" type="button">Play again</button>
      </div>
    </section>

    <script src="script.js?v=6"></script>
  </body>
</html>
